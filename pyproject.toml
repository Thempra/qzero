[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qzero"
version = "3.0.0"
description = "Quantum-algorithm-based network threat detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Thempra", email = "thempra@overxet.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Monitoring",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
qzero = "qzero.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]
quantum = [
    "qiskit>=0.45.0",
    "qiskit-machine-learning>=0.7.0",
    "torch>=2.0.0",
]
realtime = [
    "scapy>=2.5.0",
    "psutil>=5.9.0",
]
agent = [
    "scapy>=2.5.0",
]
all = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "qiskit>=0.45.0",
    "qiskit-machine-learning>=0.7.0",
    "torch>=2.0.0",
    "scapy>=2.5.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qzero = ["*.yaml", "*.json", "*.txt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
show_missing = false
