# QZero Docker Compose — Coolify-ready
# Quantum-Enhanced Threat Detection Platform v3.0.0
# Deploy on Coolify server: Nuke

services:
  # Main API service
  qzero-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qzero-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - QZERO_ENV=${QZERO_ENV:-production}
      - PYTHONPATH=/app/src
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Model config
      - QZERO_N_QUBITS=${QZERO_N_QUBITS:-4}
      - QZERO_DEFAULT_THRESHOLD=${QZERO_DEFAULT_THRESHOLD:-0.7}
    volumes:
      - qzero-models:/app/models
      - qzero-results:/app/results
      - qzero-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${QZERO_CPU_LIMIT:-4}'
          memory: ${QZERO_MEM_LIMIT:-8G}

  # Streamlit Dashboard (optional)
  qzero-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: qzero-dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      - QZERO_API_URL=http://qzero-api:8000
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      qzero-api:
        condition: service_healthy
    profiles:
      - dashboard
    restart: unless-stopped

volumes:
  qzero-models:
    driver: local
  qzero-results:
    driver: local
  qzero-data:
    driver: local

networks:
  default:
    name: qzero-network
