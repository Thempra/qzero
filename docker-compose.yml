# QZero Docker Compose — Coolify-ready
# Quantum-Enhanced Threat Detection Platform v3.0.0
# Deploy on Coolify server: Nuke

services:
  # Main API + Hub (central alert aggregator)
  qzero-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qzero-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - QZERO_ENV=${QZERO_ENV:-production}
      - PYTHONPATH=${PYTHONPATH:-/app/src}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Hub: central alert store (agent alerts)
      - QZERO_HUB_DB=/app/data/hub/hub.db
      # Hito 1 — operación confiable
      - QZERO_ALERT_RETENTION_DAYS=${QZERO_ALERT_RETENTION_DAYS:-90}
      - QZERO_TELEGRAM_BOT_TOKEN=${QZERO_TELEGRAM_BOT_TOKEN:-}
      - QZERO_TELEGRAM_CHAT_ID=${QZERO_TELEGRAM_CHAT_ID:-}
      - QZERO_AGENT_OFFLINE_MIN=${QZERO_AGENT_OFFLINE_MIN:-10}
      # Auth app-level (Hito 3.7): sin ADMIN_PASSWORD la auth queda desactivada;
      # si se define, las rutas de consulta exigen token SPA (fail-closed).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - QZERO_AUTH_SECRET=${QZERO_AUTH_SECRET:-}
      - QZERO_AUTH_TOKEN_VERSION=${QZERO_AUTH_TOKEN_VERSION:-1}
      - QZERO_REQUIRE_AGENT_TOKEN=${QZERO_REQUIRE_AGENT_TOKEN:-0}
      - QZERO_AGENT_TOKEN=${QZERO_AGENT_TOKEN:-}
      # Model config
      - QZERO_N_QUBITS=${QZERO_N_QUBITS:-4}
      - QZERO_DEFAULT_THRESHOLD=${QZERO_DEFAULT_THRESHOLD:-0.7}
    volumes:
      - qzero-models:/app/models
      - qzero-results:/app/results
      - qzero-data:/app/data
      - qzero-hub:/app/data/hub   # agent alert SQLite (hub.db)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${QZERO_CPU_LIMIT:-4}'
          memory: ${QZERO_MEM_LIMIT:-8G}

  # Streamlit Dashboard (public UI at qzero.thempra.net via main Traefik)
  qzero-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: qzero-dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      # Pin the network + port so Traefik uses the traefik_webgateway IP
      # (container is on multiple networks; without this Traefik picks the wrong one)
      - "traefik.docker.network=traefik_webgateway"
      - "traefik.http.services.qzero.loadbalancer.server.port=8501"
      - "traefik.http.routers.qzero.entrypoints=web,websecure"
      - "traefik.http.routers.qzero.rule=Host(`qzero.thempra.net`)"
      - "traefik.http.routers.qzero.tls=true"
      - "traefik.http.routers.qzero.tls.certresolver=letsencrypt"
    environment:
      - QZERO_API_URL=http://qzero-api:8000
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      qzero-api:
        condition: service_healthy
    healthcheck:
      # Streamlit readiness endpoint; makes Coolify show the stack as healthy
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  qzero-models:
    driver: local
  qzero-results:
    driver: local
  qzero-data:
    driver: local
  qzero-hub:
    driver: local

networks:
  default:
    name: qzero-network
  # Main Traefik reverse proxy (routes qzero.thempra.net -> qzero-api)
  traefik:
    external:
      name: traefik_webgateway
